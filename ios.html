<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>AR Floor Tiles — iOS (8th Wall)</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
    #camerafeed{position:fixed;inset:0;width:100%;height:100%;display:block}
    #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:60px;z-index:6;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.72);font-size:13px;line-height:1.35;pointer-events:none}
    #topActions{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:7}
    #topActions button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:20px;font-weight:700}
    #drawBar{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));z-index:8;display:none;gap:8px;justify-content:center;flex-wrap:wrap}
    #drawBar.show{display:flex}
    #drawBar button{padding:12px 16px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:700}
    #drawBar button.primary{background:#1976d2}
    #drawBar button:disabled{opacity:.4}
    #sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:16px 16px max(18px,env(safe-area-inset-bottom));background:rgba(40,40,40,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateY(110%);transition:transform .28s ease;border-radius:18px 18px 0 0}
    #sheet.open{transform:translateY(0)}
    #sheet h2{margin:0 0 14px;text-align:center;font-size:16px;font-weight:600}
    .tiles{display:flex;justify-content:center;gap:22px;margin-bottom:16px}
    .tileOpt{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:0}
    .tileOpt .ball{width:64px;height:64px;border-radius:50%;border:3px solid transparent;background-size:cover;background-position:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
    .tileOpt.active .ball{border-color:#fff}
    .tileOpt span{font-size:12px;opacity:.9}
    .row{display:flex;justify-content:center;gap:10px}
    .row button{padding:12px 18px;border:0;border-radius:10px;background:#1976d2;color:#fff;font-size:15px;font-weight:700}
    .row button.ghost{background:rgba(255,255,255,.14)}
    #aimHint{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;width:54px;height:54px;border:2px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s}
    #aimHint.on{opacity:1}
    #aimHint::before,#aimHint::after{content:"";position:absolute;background:rgba(255,255,255,.85)}
    #aimHint::before{left:50%;top:8px;bottom:8px;width:2px;transform:translateX(-50%)}
    #aimHint::after{top:50%;left:8px;right:8px;height:2px;transform:translateY(-50%)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/coaching-overlay@1/dist/coaching-overlay.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="aimHint"></div>
  <div id="hud">Loading AR engine…</div>
  <div id="topActions"><button id="btnClose" type="button" title="Reset">×</button></div>

  <div id="drawBar">
    <button id="btnUndo" type="button">Undo Point</button>
    <button id="btnClosePoly" class="primary" type="button" disabled>Close Area</button>
  </div>

  <div id="sheet">
    <h2>Select Your Preference Tile</h2>
    <div class="tiles">
      <button class="tileOpt" data-tile="brick" type="button"><div class="ball" id="prevBrick"></div><span>Brick</span></button>
      <button class="tileOpt active" data-tile="ceramic" type="button"><div class="ball" id="prevCeramic"></div><span>Ceramic</span></button>
      <button class="tileOpt" data-tile="wood" type="button"><div class="ball" id="prevWood"></div><span>Wood</span></button>
    </div>
    <div class="row">
      <button class="ghost" id="btnEditPoints" type="button">Edit Points</button>
      <button id="btnApply" type="button">Apply Tiles</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    window.THREE = THREE;

    const TILE_SIZE = 0.20;
    const FLOOR_Y = 0.003;
    const MAX_FLOOR_HIT_Y = 0.12;
    const MIN_HIT_DISTANCE = 0.45;
    const POINT_R = 0.04;
    const CLOSE_FIRST_PX = 44;   // tap near first point to close polygon
    const MIN_POINT_DIST = 0.08; // meters — ignore accidental double taps
    const HIT_TYPES = ['FEATURE_POINT', 'ESTIMATED_SURFACE', 'DETECTED_SURFACE'];

    const hud = document.getElementById('hud');
    const sheet = document.getElementById('sheet');
    const drawBar = document.getElementById('drawBar');
    const aimHint = document.getElementById('aimHint');
    const btnClose = document.getElementById('btnClose');
    const btnApply = document.getElementById('btnApply');
    const btnEditPoints = document.getElementById('btnEditPoints');
    const btnUndo = document.getElementById('btnUndo');
    const btnClosePoly = document.getElementById('btnClosePoly');

    let engineStarted = false;
    let scaleReady = false;
    let selectedTile = 'ceramic';
    let api = null;

    function status(msg){ console.log('[AR]', msg); hud.textContent = msg; }

    function prepTex(t){
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 8;
      if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
      t.needsUpdate = true;
      return t;
    }

    function makeBrickTexture(){
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#6b3a2a'; g.fillRect(0,0,256,256);
      g.fillStyle = '#8a4a36';
      const bw = 60, bh = 28, gap = 4;
      for (let row = 0; row < 12; row++) {
        const off = (row % 2) * (bw / 2);
        for (let col = -1; col < 6; col++) {
          g.fillRect(col * (bw + gap) + off + gap, row * (bh + gap) + gap, bw, bh);
        }
      }
      return prepTex(new THREE.CanvasTexture(c));
    }
    function makeCeramicTexture(){
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#d8d5cf'; g.fillRect(0,0,256,256);
      g.strokeStyle = '#9e9a92'; g.lineWidth = 6; g.strokeRect(3,3,250,250);
      return prepTex(new THREE.CanvasTexture(c));
    }
    function makeWoodTexture(){
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#b8894c'; g.fillRect(0,0,256,256);
      for (let i = 0; i < 18; i++) {
        g.strokeStyle = `rgba(90,55,20,${0.18 + (i % 5) * 0.05})`;
        g.lineWidth = 2 + (i % 3);
        g.beginPath();
        g.moveTo(0, i * 14);
        g.bezierCurveTo(80, i * 14 + 8, 160, i * 14 - 6, 256, i * 14 + 2);
        g.stroke();
      }
      return prepTex(new THREE.CanvasTexture(c));
    }

    const textures = { brick: makeBrickTexture(), ceramic: null, wood: makeWoodTexture() };

    function loadSampleJpg(){
      return new Promise((resolve) => {
        new THREE.TextureLoader().load('/tile-sample.jpg', (tex) => {
          textures.ceramic = prepTex(tex);
          resolve(tex);
        }, undefined, () => {
          textures.ceramic = makeCeramicTexture();
          resolve(textures.ceramic);
        });
      });
    }

    function setPreviewBalls(){
      const mapBall = (id, tex) => {
        const el = document.getElementById(id);
        const img = tex && tex.image;
        if (img && img.toDataURL) el.style.backgroundImage = `url(${img.toDataURL()})`;
        else if (img && img.src) el.style.backgroundImage = `url(${img.src})`;
        else el.style.background = '#aaa';
      };
      mapBall('prevBrick', textures.brick);
      mapBall('prevWood', textures.wood);
      if (textures.ceramic) mapBall('prevCeramic', textures.ceramic);
    }

    // Raycast into the Three.js scene floor plane — same space as placed geometry.
    // XR8 hitTest coords can drift relative to the scene when the camera angle changes.
    const _raycaster = new THREE.Raycaster();
    const _hit = new THREE.Vector3();

    // Keep a fixed world origin. Re-binding to the live camera pose makes
    // already-drawn areas slide when the user looks around.
    function syncXrCamera(){
      if (!window.XR8) return;
      XR8.XrController.updateCameraProjectionMatrix({
        origin: { x: 0, y: 0, z: 0 },
        facing: { x: 0, y: 0, z: 0, w: 1 },
      });
    }

    function resolveFloorPoint(cam, clientX, clientY, groundPlane){
      const ndcX = (clientX / window.innerWidth) * 2 - 1;
      const ndcY = -(clientY / window.innerHeight) * 2 + 1;
      _raycaster.setFromCamera({ x: ndcX, y: ndcY }, cam);
      const hits = _raycaster.intersectObject(groundPlane, false);
      if (hits.length) {
        return { x: hits[0].point.x, y: FLOOR_Y, z: hits[0].point.z };
      }
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -FLOOR_Y);
      if (_raycaster.ray.intersectPlane(plane, _hit)) {
        return { x: _hit.x, y: FLOOR_Y, z: _hit.z };
      }
      return null;
    }

    /** Build a floor mesh from polygon points with world-meter UV tiling. */
    function buildPolygonFill(points, texture){
      if (points.length < 3) return null;
      const shape = new THREE.Shape();
      shape.moveTo(points[0].x, points[0].z);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x, points[i].z);
      shape.closePath();

      const geo = new THREE.ShapeGeometry(shape);
      // ShapeGeometry is in XY; remap to XZ floor and set UVs from world meters.
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i); // this is world Z from shape
        pos.setXYZ(i, x, FLOOR_Y, y);
        uv.setXY(i, x / TILE_SIZE, y / TILE_SIZE);
      }
      pos.needsUpdate = true;
      uv.needsUpdate = true;
      geo.computeVertexNormals();

      const map = texture.clone();
      prepTex(map);
      map.repeat.set(1, 1);
      const mat = new THREE.MeshBasicMaterial({
        map,
        side: THREE.DoubleSide,
        depthTest: true,
        depthWrite: true,
        polygonOffset: true,
        polygonOffsetFactor: -1,
      });
      return new THREE.Mesh(geo, mat);
    }

    const tilePipelineModule = () => {
      let camera, scene, groundPlane;
      let selectionGroup, borderLine, previewLine, fillMesh;
      const vertexMeshes = [];
      /** @type {{x:number,y:number,z:number}[]} */
      let points = [];
      let closed = false;
      let mode = 'draw'; // draw | closed | filled
      let dragIndex = -1;
      let previewAim = null;

      function syncDrawUi(){
        const drawing = mode === 'draw';
        drawBar.classList.toggle('show', drawing && scaleReady);
        btnClosePoly.disabled = points.length < 3;
        btnUndo.disabled = points.length === 0;
        sheet.classList.toggle('open', mode === 'closed' || mode === 'filled');
        aimHint.classList.toggle('on', scaleReady && mode === 'draw');
      }

      function clearFill(){
        if (fillMesh) {
          selectionGroup.remove(fillMesh);
          fillMesh.geometry.dispose();
          fillMesh.material.map?.dispose?.();
          fillMesh.material.dispose();
          fillMesh = null;
        }
      }

      function rebuildPolyline(includeClose){
        const n = points.length;
        if (n === 0) {
          borderLine.visible = false;
          previewLine.visible = false;
          return;
        }
        const closedCount = includeClose && n >= 3 ? n + 1 : n;
        const arr = new Float32Array(closedCount * 3);
        for (let i = 0; i < n; i++) {
          arr[i * 3] = points[i].x;
          arr[i * 3 + 1] = FLOOR_Y + 0.004;
          arr[i * 3 + 2] = points[i].z;
        }
        if (includeClose && n >= 3) {
          arr[n * 3] = points[0].x;
          arr[n * 3 + 1] = FLOOR_Y + 0.004;
          arr[n * 3 + 2] = points[0].z;
        }
        borderLine.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        borderLine.geometry.attributes.position.needsUpdate = true;
        borderLine.geometry.computeBoundingSphere();
        borderLine.visible = true;
        borderLine.material.color.setHex(mode === 'filled' ? 0xffffff : 0x2f7bff);
      }

      function syncVertices(){
        while (vertexMeshes.length < points.length) {
          const m = new THREE.Mesh(
            new THREE.SphereGeometry(POINT_R, 16, 12),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
          );
          selectionGroup.add(m);
          vertexMeshes.push(m);
        }
        for (let i = 0; i < vertexMeshes.length; i++) {
          if (i < points.length) {
            vertexMeshes[i].position.set(points[i].x, FLOOR_Y + 0.012, points[i].z);
            vertexMeshes[i].visible = mode !== 'filled';
            // First point highlighted while drawing so user knows how to close
            vertexMeshes[i].material.color.setHex(i === 0 && mode === 'draw' ? 0x4caf50 : 0xffffff);
            vertexMeshes[i].scale.setScalar(i === 0 && mode === 'draw' ? 1.25 : 1);
          } else {
            vertexMeshes[i].visible = false;
          }
        }
      }

      function updatePreviewTo(aim){
        if (mode !== 'draw' || points.length === 0 || !aim) {
          previewLine.visible = false;
          return;
        }
        const last = points[points.length - 1];
        const arr = new Float32Array([
          last.x, FLOOR_Y + 0.005, last.z,
          aim.x, FLOOR_Y + 0.005, aim.z,
        ]);
        previewLine.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        previewLine.geometry.attributes.position.needsUpdate = true;
        previewLine.visible = true;
      }

      function refresh(){
        rebuildPolyline(closed || mode !== 'draw');
        syncVertices();
        syncDrawUi();
      }

      function addPoint(p){
        if (points.length) {
          const last = points[points.length - 1];
          if (Math.hypot(p.x - last.x, p.z - last.z) < MIN_POINT_DIST) return;
        }
        points.push({ x: p.x, y: FLOOR_Y, z: p.z });
        refresh();
        status(points.length < 3
          ? `Point ${points.length} set — keep tapping corners of the floor area.`
          : `Point ${points.length} set — tap the green first point (or Close Area) to finish.`);
      }

      function undoPoint(){
        if (!points.length || mode === 'filled') return;
        points.pop();
        closed = false;
        mode = 'draw';
        clearFill();
        refresh();
        status(points.length
          ? `Removed last point (${points.length} left). Tap to add more.`
          : 'All points cleared. Tap the floor to start the area.');
      }

      function closePolygon(){
        if (points.length < 3) {
          status('Need at least 3 points to close the area.');
          return;
        }
        closed = true;
        mode = 'closed';
        clearFill();
        previewLine.visible = false;
        refresh();
        status('Area closed & locked to the floor. Pick a tile, then Apply Tiles.');
      }

      function applyFill(){
        if (points.length < 3) {
          status('Draw and close an area first (3+ points).');
          return;
        }
        if (!closed) closePolygon();
        clearFill();
        const tex = textures[selectedTile] || textures.ceramic;
        fillMesh = buildPolygonFill(points, tex);
        if (!fillMesh) return;
        selectionGroup.add(fillMesh);
        mode = 'filled';
        refresh();
        status('Tiles locked to the floor — move around, the area stays put.');
      }

      function clearAll(){
        points = [];
        closed = false;
        mode = 'draw';
        dragIndex = -1;
        clearFill();
        previewLine.visible = false;
        refresh();
        status('Tap points on the floor to outline the area (polygonal ROI).');
      }

      function enterEditPoints(){
        if (!points.length) return;
        mode = 'draw';
        closed = false;
        clearFill();
        refresh();
        status('Editing points — drag a white dot, tap to add, or Close Area when done.');
      }

      function pickVertex(clientX, clientY){
        let best = -1, bestDist = CLOSE_FIRST_PX;
        for (let i = 0; i < points.length; i++) {
          if (!vertexMeshes[i]) continue;
          const p = vertexMeshes[i].position.clone().project(camera);
          const sx = (p.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-p.y * 0.5 + 0.5) * window.innerHeight;
          const d = Math.hypot(sx - clientX, sy - clientY);
          if (d < bestDist) { bestDist = d; best = i; }
        }
        return best;
      }

      function onTouchStart(e){
        if (!scaleReady) return;
        if (sheet.contains(e.target) || drawBar.contains(e.target) || btnClose.contains(e.target)) return;
        // After apply, taps must not move the locked polygon — use Edit Points.
        if (mode === 'filled') return;
        const t = e.changedTouches ? e.changedTouches[0] : e;

        // Drag existing vertex while drawing/editing
        if (mode === 'draw' || mode === 'closed') {
          const idx = pickVertex(t.clientX, t.clientY);
          if (idx >= 0) {
            // Tap first point with 3+ verts → close polygon
            if (mode === 'draw' && idx === 0 && points.length >= 3) {
              closePolygon();
              e.preventDefault();
              return;
            }
            if (mode === 'draw') {
              dragIndex = idx;
              clearFill();
              syncDrawUi();
              e.preventDefault();
              return;
            }
          }
        }

        if (mode === 'draw') {
          const p = resolveFloorPoint(camera, t.clientX, t.clientY, groundPlane);
          if (!p) {
            status('No floor there — aim at open ground, then tap.');
            return;
          }
          addPoint(p);
          e.preventDefault();
        }
      }

      function onTouchMove(e){
        if (dragIndex < 0) return;
        const t = e.changedTouches ? e.changedTouches[0] : e;
        const p = resolveFloorPoint(camera, t.clientX, t.clientY, groundPlane);
        if (!p) return;
        points[dragIndex] = p;
        refresh();
        e.preventDefault();
      }

      function onTouchEnd(){ dragIndex = -1; }

      api = {
        applyFill,
        clearAll,
        undoPoint,
        closePolygon,
        enterEditPoints,
        setTile(name){
          selectedTile = name;
          if (mode === 'filled') applyFill();
        },
      };

      return {
        name: 'polygonroi',
        listeners: [
          { event: 'coaching-overlay.show', process: () => {
            scaleReady = false;
            syncDrawUi();
            status('Push phone forward, then pull back to set floor scale…');
          } },
          { event: 'coaching-overlay.hide', process: () => {
            scaleReady = true;
            syncXrCamera();
            syncDrawUi();
            status('Tap points on the floor to outline your area. Close when done.');
          } },
        ],
        onStart: ({ canvas }) => {
          const xr = XR8.Threejs.xrScene();
          scene = xr.scene;
          camera = xr.camera;
          scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 0.95));

          selectionGroup = new THREE.Group();
          scene.add(selectionGroup);

          // Fixed world floor for raycasts — points stay anchored when camera moves.
          groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          groundPlane.position.y = FLOOR_Y;
          scene.add(groundPlane);

          borderLine = new THREE.Line(
            new THREE.BufferGeometry(),
            new THREE.LineBasicMaterial({ color: 0x2f7bff })
          );
          borderLine.visible = false;
          selectionGroup.add(borderLine);

          previewLine = new THREE.Line(
            new THREE.BufferGeometry(),
            new THREE.LineDashedMaterial({ color: 0x90caf9, dashSize: 0.05, gapSize: 0.03 })
          );
          previewLine.visible = false;
          selectionGroup.add(previewLine);

          syncXrCamera();

          canvas.addEventListener('touchstart', onTouchStart, { passive: false });
          canvas.addEventListener('touchmove', onTouchMove, { passive: false });
          canvas.addEventListener('touchend', onTouchEnd, { passive: true });
          canvas.addEventListener('mousedown', onTouchStart);
          window.addEventListener('mousemove', onTouchMove);
          window.addEventListener('mouseup', onTouchEnd);

          syncDrawUi();
          status('Move phone forward then back to measure room scale…');
        },
        onUpdate: () => {
          if (!camera || !scaleReady) return;
          // Preview line only while drawing an open polygon — not after close/apply.
          if (mode !== 'draw' || points.length === 0) {
            previewLine.visible = false;
            return;
          }
          const aim = resolveFloorPoint(camera, innerWidth * 0.5, innerHeight * 0.55, groundPlane);
          if (aim) {
            updatePreviewTo(aim);
            try { previewLine.computeLineDistances(); } catch (_) {}
          } else {
            previewLine.visible = false;
          }
        },
      };
    };

    document.querySelectorAll('.tileOpt').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tileOpt').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTile = btn.dataset.tile;
        if (api) api.setTile(selectedTile);
      });
    });
    btnApply.addEventListener('click', () => api?.applyFill());
    btnEditPoints.addEventListener('click', () => api?.enterEditPoints());
    btnClose.addEventListener('click', () => api?.clearAll());
    btnUndo.addEventListener('click', () => api?.undoPoint());
    btnClosePoly.addEventListener('click', () => api?.closePolygon());

    function startEngine(){
      if (engineStarted || !window.XR8) return;
      engineStarted = true;
      status('Starting camera…');

      loadSampleJpg().then(() => {
        setPreviewBalls();
        try {
          XR8.XrController.configure({ disableWorldTracking: false, scale: 'absolute' });
          if (window.CoachingOverlay?.configure) {
            CoachingOverlay.configure({
              animationColor: '#1976d2',
              promptText: 'Push phone forward, then pull back to set floor scale',
            });
          }
          const modules = [
            XR8.GlTextureRenderer.pipelineModule(),
            XR8.Threejs.pipelineModule(),
            XR8.XrController.pipelineModule(),
            XRExtras.FullWindowCanvas.pipelineModule(),
            XRExtras.RuntimeError.pipelineModule(),
            tilePipelineModule(),
          ];
          if (window.CoachingOverlay?.pipelineModule) {
            modules.splice(4, 0, CoachingOverlay.pipelineModule());
          } else {
            scaleReady = true;
            aimHint.classList.add('on');
          }
          XR8.addCameraPipelineModules(modules);
          XR8.run({
            canvas: document.getElementById('camerafeed'),
            allowedDevices: XR8.XrConfig.device().MOBILE,
          });
        } catch (err) {
          console.error(err);
          engineStarted = false;
          status('AR failed to start: ' + (err.message || err));
        }
      });
    }

    status('Waiting for AR engine…');
    if (window.XR8) startEngine();
    else {
      window.addEventListener('xrloaded', startEngine);
      const poll = setInterval(() => { if (window.XR8) { clearInterval(poll); startEngine(); } }, 200);
      setTimeout(() => {
        clearInterval(poll);
        if (!engineStarted) status('AR engine did not load. Check internet, then reload.');
      }, 20000);
    }
  </script>
</body>
</html>
